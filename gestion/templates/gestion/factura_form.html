{% extends 'gestion/base.html' %}

{% block title %}Crear Factura - Restaurante Pasta La Vista{% endblock %}

{% block content %}
<h2>Crear Factura</h2>

{% if ordenes %}
<form method="post" class="form-container">
    {% csrf_token %}

    <label for="orden">Orden *</label>
    <select id="orden" name="orden" required>
        <option value="">Seleccione una orden</option>
        {% for orden in ordenes %}
            <option value="{{ orden.id }}">Orden #{{ orden.id }} - {{ orden.cliente.nombre }}</option>
        {% endfor %}
    </select>

    <label for="metodo_pago">Método de pago *</label>
    <select id="metodo_pago" name="metodo_pago" required>
        <option value="">Seleccione un método</option>
        {% for valor, etiqueta in metodos_pago %}
            <option value="{{ valor }}">{{ etiqueta }}</option>
        {% endfor %}
    </select>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Generar Factura</button>
        <a href="{% url 'lista_facturas' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% else %}
<div class="no-data">
    <p>No hay órdenes sin factura disponibles.</p>
    <a href="{% url 'lista_ordenes' %}" class="btn btn-secondary">Ver Órdenes</a>
</div>
{% endif %}
{% endblock %}
