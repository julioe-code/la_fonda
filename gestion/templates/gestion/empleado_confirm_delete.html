{% extends 'gestion/base.html' %}

{% block title %}Eliminar Empleado - Restaurante Pasta La Vista{% endblock %}

{% block content %}
<h2>Eliminar Empleado</h2>
<p>¿Estás seguro de que deseas eliminar al empleado <strong>{{ empleado.nombre }}</strong>?</p>

<form method="post" class="form-container">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'lista_empleados' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
