{% extends 'gestion/base.html' %}

{% block title %}Eliminar Plato - Restaurante Pasta La Vista{% endblock %}

{% block content %}
<h2>Eliminar Plato</h2>
<p>¿Estás seguro de que deseas eliminar el plato <strong>{{ plato.nombre_plato }}</strong>?</p>

<form method="post" class="form-container">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'lista_platos' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
