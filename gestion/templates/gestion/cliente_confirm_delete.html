{% extends 'gestion/base.html' %}

{% block title %}Eliminar Cliente - Restaurante Pasta La Vista{% endblock %}

{% block content %}
<h2>Eliminar Cliente</h2>
<p>¿Estás seguro de que deseas eliminar al cliente <strong>{{ cliente.nombre }}</strong>?</p>

<form method="post" class="form-container">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
