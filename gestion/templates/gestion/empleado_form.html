{% extends 'gestion/base.html' %}

{% block title %}{% if empleado %}Editar Empleado{% else %}Crear Empleado{% endif %} - Restaurante Pasta La Vista{% endblock %}

{% block content %}
<h2>{% if empleado %}Editar Empleado{% else %}Crear Empleado{% endif %}</h2>

<form method="post" class="form-container">
    {% csrf_token %}

    <label for="nombre">Nombre *</label>
    <input type="text" id="nombre" name="nombre" value="{{ empleado.nombre|default:'' }}" required>

    <label for="cargo">Cargo *</label>
    <select id="cargo" name="cargo" required>
        <option value="">Seleccione un cargo</option>
        {% for valor, etiqueta in cargos %}
            <option value="{{ valor }}" {% if empleado and empleado.cargo == valor %}selected{% endif %}>{{ etiqueta }}</option>
        {% endfor %}
    </select>

    <label for="telefono">Teléfono</label>
    <input type="text" id="telefono" name="telefono" value="{{ empleado.telefono|default:'' }}">

    <label for="correo">Correo</label>
    <input type="email" id="correo" name="correo" value="{{ empleado.correo|default:'' }}">

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'lista_empleados' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
